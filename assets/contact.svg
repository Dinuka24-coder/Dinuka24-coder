<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Let's build something secure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="frame"><rect x="10" y="10" width="1180" height="240" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="10" y="10" width="1180" height="240" fill="url(#bg)"/>

    <!-- waves -->
    <g transform="translate(0 190)" opacity="0.35">
      <path fill="#38bdf8" d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 T1500 30 T1800 30 T2100 30 T2400 30 V90 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(0 205)" opacity="0.35">
      <path fill="#a78bfa" d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 T1500 30 T1800 30 T2100 30 T2400 30 V90 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- signal -->
    <g transform="translate(1030 110)" fill="none" stroke="#38bdf8">
      <circle r="10" fill="#38bdf8" stroke="none"/>
      <circle r="10"><animate attributeName="r" from="10" to="90" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.8" to="0" dur="3s" repeatCount="indefinite"/></circle>
      <circle r="10"><animate attributeName="r" from="10" to="90" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.8" to="0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
      <circle r="10"><animate attributeName="r" from="10" to="90" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.8" to="0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
      <text x="60" y="70" font-size="13" letter-spacing="4" fill="#64748b" font-family="Consolas,'Courier New',monospace">KEEP THE SIGNAL MOVING</text>
      <text x="60" y="128" font-size="48" font-weight="800" fill="url(#ac)">Let's build something secure.</text>
      <text x="62" y="164" font-size="18" fill="#94a3b8">Open to internships, collaboration, and conversations</text>
      <text x="62" y="188" font-size="18" fill="#94a3b8">about systems, security, and the cloud.</text>
    </g>
  </g>
  <rect x="10" y="10" width="1180" height="240" rx="22" fill="none" stroke="#1e293b"/>
</svg>
