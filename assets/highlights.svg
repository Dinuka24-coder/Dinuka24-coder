<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Foundation: IT and Systems. Passion: Network Security. Direction: Cloud Architecture">
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">

    <!-- CARD 1 -->
    <g transform="translate(10,10)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
        <rect width="370" height="250" rx="20" fill="#0d1326" stroke="#38bdf8" stroke-opacity="0.4"/>
        <rect x="28" width="90" height="4" rx="2" fill="#38bdf8"/>
        <circle cx="338" cy="36" r="5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
        <text x="28" y="48" font-size="13" letter-spacing="3" fill="#38bdf8" font-family="Consolas,'Courier New',monospace">01 · FOUNDATION</text>
        <g transform="translate(28,68) scale(1.5)" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round">
          <rect x="4" y="8" width="40" height="14" rx="3"/><rect x="4" y="26" width="40" height="14" rx="3"/>
          <circle cx="12" cy="15" r="1.8" fill="#38bdf8"/><circle cx="12" cy="33" r="1.8" fill="#38bdf8"/>
          <line x1="22" y1="15" x2="36" y2="15"/><line x1="22" y1="33" x2="36" y2="33"/>
        </g>
        <text x="28" y="182" font-size="28" font-weight="700" fill="#f1f5f9">IT &amp; Systems</text>
        <text x="28" y="208" font-size="15" fill="#94a3b8">Linux, virtualization and databases:</text>
        <text x="28" y="230" font-size="15" fill="#94a3b8">the base everything else sits on.</text>
      </g>
    </g>

    <!-- CARD 2 -->
    <g transform="translate(415,10)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" begin="1s" repeatCount="indefinite"/>
        <rect width="370" height="250" rx="20" fill="#0d1326" stroke="#a78bfa" stroke-opacity="0.4"/>
        <rect x="28" width="90" height="4" rx="2" fill="#a78bfa"/>
        <circle cx="338" cy="36" r="5" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
        <text x="28" y="48" font-size="13" letter-spacing="3" fill="#a78bfa" font-family="Consolas,'Courier New',monospace">02 · PASSION</text>
        <g transform="translate(28,68) scale(1.5)" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 4 L40 10 V24 C40 33 33 40 24 44 C15 40 8 33 8 24 V10 Z"/>
          <path d="M17 24 L22 29 L31 18"/>
        </g>
        <text x="28" y="182" font-size="28" font-weight="700" fill="#f1f5f9">Network Security</text>
        <text x="28" y="208" font-size="15" fill="#94a3b8">Firewalls, secure design and threat</text>
        <text x="28" y="230" font-size="15" fill="#94a3b8">analysis: learning how systems defend.</text>
      </g>
    </g>

    <!-- CARD 3 -->
    <g transform="translate(820,10)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" begin="2s" repeatCount="indefinite"/>
        <rect width="370" height="250" rx="20" fill="#0d1326" stroke="#22d3ee" stroke-opacity="0.4"/>
        <rect x="28" width="90" height="4" rx="2" fill="#22d3ee"/>
        <circle cx="338" cy="36" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
        <text x="28" y="48" font-size="13" letter-spacing="3" fill="#22d3ee" font-family="Consolas,'Courier New',monospace">03 · DIRECTION</text>
        <g transform="translate(28,68) scale(1.5)" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 36 H34 A8 8 0 0 0 35 20 A12 12 0 0 0 12 22 A7 7 0 0 0 14 36 Z"/>
        </g>
        <text x="28" y="182" font-size="28" font-weight="700" fill="#f1f5f9">Cloud Architecture</text>
        <text x="28" y="208" font-size="15" fill="#94a3b8">AWS and GCP: designing infrastructure</text>
        <text x="28" y="230" font-size="15" fill="#94a3b8">that is secure and scalable from day one.</text>
      </g>
    </g>
  </g>
</svg>
