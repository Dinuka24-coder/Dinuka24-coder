<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Roadmap from IT foundation to cloud architect">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="1180" height="220" rx="22" fill="#0b1020" stroke="#1e293b"/>

  <!-- track -->
  <rect x="100" y="98" width="1000" height="4" rx="2" fill="#1e293b"/>
  <rect x="100" y="98" width="0" height="4" rx="2" fill="url(#ac)">
    <animate attributeName="width" from="0" to="600" dur="2.5s" fill="freeze"/>
  </rect>
  <circle cy="100" r="6" fill="#ffffff">
    <animate attributeName="cx" from="100" to="700" dur="2.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.95;1" dur="2.5s" fill="freeze"/>
  </circle>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g font-family="Consolas,'Courier New',monospace" font-size="13" fill="#475569">
      <text x="100" y="56">01</text><text x="300" y="56">02</text><text x="500" y="56">03</text>
      <text x="700" y="56">04</text><text x="900" y="56">05</text><text x="1100" y="56">06</text>
    </g>

    <!-- done nodes -->
    <g fill="#0b1020" stroke="#34d399" stroke-width="3">
      <circle cx="100" cy="100" r="16"/><circle cx="300" cy="100" r="16"/><circle cx="500" cy="100" r="16"/>
    </g>
    <g fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(100 100)" d="M-6 0 l4 5 l8 -9"/>
      <path transform="translate(300 100)" d="M-6 0 l4 5 l8 -9"/>
      <path transform="translate(500 100)" d="M-6 0 l4 5 l8 -9"/>
    </g>

    <!-- active node -->
    <circle cx="700" cy="100" r="16" fill="#0b1020" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="700" cy="100" r="6" fill="#a78bfa"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="100" r="16" fill="none" stroke="#a78bfa" stroke-width="2">
      <animate attributeName="r" from="16" to="40" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- future nodes -->
    <g fill="#0b1020" stroke="#475569" stroke-width="3" stroke-dasharray="4 4">
      <circle cx="900" cy="100" r="16"/><circle cx="1100" cy="100" r="16"/>
    </g>
    <circle cx="900" cy="100" r="4" fill="#475569"/>
    <path transform="translate(1100 100)" d="M-9 4 H8 A5 5 0 0 0 9 -5 A8 8 0 0 0 -7 -3 A4.5 4.5 0 0 0 -9 4 Z" fill="none" stroke="#64748b" stroke-width="1.8"/>

    <!-- labels -->
    <g font-size="17" font-weight="600" fill="#f1f5f9">
      <text x="100" y="156">Systems foundation</text>
      <text x="300" y="156">Networking basics</text>
      <text x="500" y="156">Router DR project</text>
      <text x="700" y="156">Firewall &amp; Threat Lab</text>
      <text x="900" y="156">Cloud certification</text>
      <text x="1100" y="156">Cloud architect</text>
    </g>
    <g font-family="Consolas,'Courier New',monospace" font-size="12" letter-spacing="2">
      <text x="100" y="182" fill="#34d399">DONE</text>
      <text x="300" y="182" fill="#34d399">DONE</text>
      <text x="500" y="182" fill="#34d399">DONE</text>
      <text x="700" y="182" fill="#a78bfa">IN PROGRESS</text>
      <text x="900" y="182" fill="#64748b">NEXT</text>
      <text x="1100" y="182" fill="#64748b">GOAL</text>
    </g>
  </g>
</svg>
