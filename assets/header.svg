<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Dinuka Amarasekara - IT and Systems, Network Security, Cloud Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- network links with flowing "packets" -->
  <g stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="6 8" fill="none">
    <line x1="820" y1="80" x2="940" y2="190"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="940" y1="190" x2="1050" y2="90"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/></line>
    <line x1="1050" y1="90" x2="1120" y2="230"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="940" y1="190" x2="880" y2="275"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3.4s" repeatCount="indefinite"/></line>
    <line x1="940" y1="190" x2="1120" y2="230"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="820" y1="80" x2="1050" y2="90"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3.8s" repeatCount="indefinite"/></line>
  </g>

  <!-- nodes -->
  <g fill="#0b1020" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="820" cy="80" r="11"/>
    <circle cx="1050" cy="90" r="11"/>
    <circle cx="1120" cy="230" r="11"/>
    <circle cx="880" cy="275" r="11"/>
    <!-- central node = "firewall / core" -->
    <circle cx="940" cy="190" r="18"/>
  </g>
  <circle cx="940" cy="190" r="6" fill="#a78bfa"/>

  <!-- pulse rings -->
  <g fill="none" stroke="#a78bfa" stroke-width="2">
    <circle cx="940" cy="190" r="18">
      <animate attributeName="r" from="18" to="55" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="90" r="11">
      <animate attributeName="r" from="11" to="34" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="80" r="11">
      <animate attributeName="r" from="11" to="34" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="150" font-size="60" font-weight="700" fill="url(#accent)" opacity="0">
      Dinuka Amarasekara
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="62" y="198" font-size="22" fill="#cbd5e1" opacity="0">
      IT &amp; Systems  ·  Network Security  ·  Cloud Architecture
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="62" y="245" font-size="16" fill="#64748b" font-family="Consolas, Menlo, monospace" opacity="0">
      // secure by design. built for the cloud.
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1.2s" fill="freeze"/>
    </text>
    <rect x="455" y="231" width="9" height="18" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
