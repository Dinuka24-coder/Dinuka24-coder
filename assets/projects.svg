<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Projects">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- CARD 1 -->
  <g transform="translate(10,10)">
    <rect width="575" height="280" rx="22" fill="#0d1326"/>
    <g fill="none" stroke="#a78bfa" stroke-opacity="0.09" stroke-width="2.5">
      <path d="M470 60 L540 85 V150 C540 190 510 215 470 235 C430 215 400 190 400 150 V85 Z"/>
      <path d="M470 95 L515 110 V150 C515 175 495 192 470 205 C445 192 425 175 425 150 V110 Z"/>
    </g>
    <rect width="575" height="280" rx="22" fill="none" stroke="url(#pg)" stroke-width="2" stroke-dasharray="40 20">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="30" width="220" height="28" rx="14" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/>
    <circle cx="48" cy="44" r="4" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="49" font-size="12" fill="#fde68a" font-family="monospace">FEATURED - IN PROGRESS</text>
    <text x="30" y="110" font-size="28" font-weight="700" fill="#f1f5f9" font-family="Arial, sans-serif">Firewall &amp; Threat Analysis Lab</text>
    <text x="30" y="145" font-size="16" fill="#94a3b8" font-family="Arial, sans-serif">Secure virtual environments, firewall</text>
    <text x="30" y="169" font-size="16" fill="#94a3b8" font-family="Arial, sans-serif">configuration and traffic &amp; threat analysis.</text>
    <g font-size="13" fill="#e2e8f0" text-anchor="middle" font-family="monospace">
      <rect x="30" y="206" width="136" height="32" rx="16" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="98" y="227">Virtualization</text>
      <rect x="178" y="206" width="96" height="32" rx="16" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="226" y="227">Firewalls</text>
      <rect x="286" y="206" width="144" height="32" rx="16" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="358" y="227">Threat Analysis</text>
    </g>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(615,10)">
    <rect width="575" height="280" rx="22" fill="#0d1326"/>
    <g fill="none" stroke="#22d3ee" stroke-opacity="0.09" stroke-width="2.5">
      <circle cx="470" cy="150" r="80"/>
      <circle cx="470" cy="150" r="50"/>
      <circle cx="470" cy="150" r="20"/>
    </g>
    <rect width="575" height="280" rx="22" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="40 20">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="30" width="170" height="28" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
    <circle cx="48" cy="44" r="4" fill="#34d399"/>
    <text x="62" y="49" font-size="12" fill="#a7f3d0" font-family="monospace">PUBLISHED</text>
    <text x="30" y="110" font-size="28" font-weight="700" fill="#f1f5f9" font-family="Arial, sans-serif">Cisco Router Disaster Recovery</text>
    <text x="30" y="145" font-size="16" fill="#94a3b8" font-family="Arial, sans-serif">Python automation that restores Cisco router</text>
    <text x="30" y="169" font-size="16" fill="#94a3b8" font-family="Arial, sans-serif">configurations quickly after a failure.</text>
    <g font-size="13" fill="#e2e8f0" text-anchor="middle" font-family="monospace">
      <rect x="30" y="206" width="72" height="32" rx="16" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="66" y="227">Python</text>
      <rect x="114" y="206" width="64" height="32" rx="16" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="146" y="227">Cisco</text>
      <rect x="190" y="206" width="104" height="32" rx="16" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="242" y="227">Automation</text>
    </g>
  </g>
</svg>
